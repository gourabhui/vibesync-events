name: Fix VibeSync logo display
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-logo:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop transparent logo canvas with CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.logo{width:205px;display:block}', '.logo{width:260px;height:76px;display:block;position:relative;overflow:hidden}.logo img{position:absolute;left:50%;top:50%;width:330px;height:330px;max-width:none;transform:translate(-50%,-50%)}')
          s = s.replace('.logo{width:155px}', '.logo{width:190px;height:58px}.logo img{width:245px;height:245px}')
          p.write_text(s)
          PY
      - name: Commit logo fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix logo size and transparent canvas [skip ci]' && git push)
