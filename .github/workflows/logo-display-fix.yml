name: Fix VibeSync logo display
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-logo:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the real transparent PNG logo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh api /repos/${{ github.repository }}/git/blobs/ada5a524fafa1ca959babc77ead5ce6127498109 --jq .content | base64 -d > assets/vibesync-logo.png
      - name: Point navbar to transparent PNG and size it cleanly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'<img[^>]*alt=["\']VibeSync Events["\'][^>]*>', '<img src="./assets/vibesync-logo.png" alt="VibeSync Events">', s, count=1)
          s = re.sub(r'\.logo\{[^}]*\}', '.logo{width:155px;height:58px;display:flex;align-items:center;overflow:hidden}', s, count=1)
          s = re.sub(r'\.logo img\{[^}]*\}', '.logo img{display:block;width:155px;height:auto}', s, count=1)
          s = s.replace('mix-blend-mode:screen;','')
          s = re.sub(r'\.logo\{width:\d+px\}', '.logo{width:155px}', s)
          p.write_text(s)
          PY
      - name: Commit the finished logo fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/vibesync-logo.png
          git diff --cached --quiet || (git commit -m 'Use transparent VibeSync PNG logo [skip ci]' && git push)
