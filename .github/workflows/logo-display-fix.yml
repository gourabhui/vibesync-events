name: Fix VibeSync logo display
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-logo:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo source and styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          good = 'https://raw.githubusercontent.com/gourabhui/vibesync-events-portfolio/main/images/670855447_17930190945276288_6552016598343555044_n.jpg'
          s = re.sub(r'<img[^>]*alt=["\']VibeSync Events["\'][^>]*>', '<img src="'+good+'" alt="VibeSync Events">', s, count=1)
          s = re.sub(r'\.logo\{[^}]*\}', '.logo{width:170px;height:58px;display:flex;align-items:center;overflow:hidden}', s, count=1)
          s = re.sub(r'\.logo img\{[^}]*\}', '.logo img{display:block;width:170px;height:auto;mix-blend-mode:screen}', s, count=1)
          s = re.sub(r'@media\(max-width:600px\)\{', '@media(max-width:600px){', s)
          s = re.sub(r'\.logo\{width:\d+px\}', '.logo{width:150px}', s)
          s = re.sub(r'\.cursor\.big\{width:\d+px;height:\d+px;', '.cursor.big{width:72px;height:72px;', s)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix broken logo source and sizing [skip ci]' && git push)
